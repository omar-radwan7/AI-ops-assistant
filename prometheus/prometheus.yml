global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels:
          server: laptop

  - job_name: shop
    static_configs:
      - targets: ["127.0.0.1:9200"]
        labels:
          server: laptop

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
