# ai-ops-assistant
# Every service listens on 127.0.0.1 only, so nothing is reachable from outside the machine.
#
# Always started:      docker-proxy (read-only Docker access), postgres (incidents)
# Profile "n8n":       n8n, for a server that has no n8n yet
# Profile "metrics":   Prometheus, Alertmanager, node-exporter, Grafana (server metrics and dashboard)
# Profile "demo":      a tiny demo service to trigger alerts
# Choose profiles with COMPOSE_PROFILES in .env, then run ./install.sh

services:
  docker-proxy:
    # Read-only gate to the Docker API: lists containers, details and logs.
    # Starting, stopping or deleting containers is blocked (POST=0).
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:2375:2375"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    network_mode: host
    command: postgres -c listen_addresses=127.0.0.1 -p 5433
    environment:
      POSTGRES_DB: ops
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5433", "-U", "ops"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  n8n:
    profiles: ["n8n"]
    image: docker.n8n.io/n8nio/n8n:2.49.6
    container_name: ai-ops-n8n
    network_mode: host
    environment:
      N8N_LISTEN_ADDRESS: 127.0.0.1
      N8N_PORT: "5678"
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: ${TIMEZONE:-UTC}
      TZ: ${TIMEZONE:-UTC}
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

  node-exporter:
    profiles: ["metrics"]
    image: prom/node-exporter:v1.8.2
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

  prometheus:
    profiles: ["metrics"]
    image: prom/prometheus:v2.54.1
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.listen-address=127.0.0.1:9090
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  alertmanager:
    profiles: ["metrics"]
    image: prom/alertmanager:v0.27.0
    network_mode: host
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --web.listen-address=127.0.0.1:9093
      - --cluster.listen-address=
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    restart: unless-stopped

  grafana:
    profiles: ["metrics"]
    image: grafana/grafana:11.2.0
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

  shop:
    # A tiny demo service that exposes metrics. Stop it to trigger a ServiceDown alert.
    profiles: ["demo"]
    image: python:3.12-alpine
    network_mode: host
    command: python /app/shop.py
    volumes:
      - ./demo/shop.py:/app/shop.py:ro
    restart: "no"

volumes:
  prometheus_data:
  postgres_data:
  grafana_data:
  n8n_data:
